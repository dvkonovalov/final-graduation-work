version: '3'
services:
  web:
    build:
      context: app
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      private_key: ${private_key_app}
    ports:
      - "5000:5000"
    volumes:
      - ./app:/app
    depends_on:
      - database
    networks:
      - crypto-network
    
