global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['nodeexporter:9100']

  - job_name: 'web'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['web:5000']

  - job_name: 'retraining'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['retrain:5004']
